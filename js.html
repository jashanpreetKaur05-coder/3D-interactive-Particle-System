<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Interactive Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #overlay {
            position: absolute; top: 20px; left: 20px; color: #0ff; 
            pointer-events: none; text-shadow: 0 0 10px #000;
        }
        .controls { color: #fff; font-size: 0.9em; margin-top: 10px; }
        kbd { background: #333; padding: 2px 5px; border-radius: 3px; border: 1px solid #777; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>Interactive 3D Particles</h2>
    <div id="active-mode">Mode: FLOATING CLOUD</div>
    <div class="controls">
        <p><kbd>1</kbd> Cloud | <kbd>2</kbd> Heart | <kbd>3</kbd> Saturn | <kbd>4</kbd> Flower | <kbd>5</kbd> Explode</p>
        <p>• Move Mouse to attract particles • Click to change colors</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
    const P_COUNT = 15000;
    let scene, camera, renderer, points;
    let positions, targets, colors;
    let mouse = { x: 0, y: 0 };
    let currentMode = 'CLOUD';

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        positions = new Float32Array(P_COUNT * 3);
        targets = new Float32Array(P_COUNT * 3);
        colors = new Float32Array(P_COUNT * 3);

        for (let i = 0; i < P_COUNT; i++) {
            const i3 = i * 3;
            // Start at random positions
            positions[i3] = (Math.random() - 0.5) * 50;
            positions[i3+1] = (Math.random() - 0.5) * 50;
            positions[i3+2] = (Math.random() - 0.5) * 50;
            
            colors[i3] = Math.random();
            colors[i3+1] = Math.random();
            colors[i3+2] = 1.0;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });

        points = new THREE.Points(geo, mat);
        scene.add(points);
        
        setShape('CLOUD');
    }

    function setShape(mode) {
        currentMode = mode;
        document.getElementById('active-mode').innerText = "Mode: " + mode;
        
        for (let i = 0; i < P_COUNT; i++) {
            const i3 = i * 3;
            let tx, ty, tz;

            if (mode === 'HEART') {
                const t = Math.random() * Math.PI * 2;
                tx = 0.6 * (16 * Math.pow(Math.sin(t), 3));
                ty = 0.6 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                tz = (Math.random() - 0.5) * 4;
            } 
            else if (mode === 'SATURN') {
                if (i < P_COUNT * 0.4) {
                    const phi = Math.acos(-1 + (Math.random() * 2));
                    const theta = Math.random() * Math.PI * 2;
                    tx = Math.cos(theta) * Math.sin(phi) * 6;
                    ty = Math.sin(theta) * Math.sin(phi) * 6;
                    tz = Math.cos(phi) * 6;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 9 + Math.random() * 3;
                    tx = Math.cos(angle) * r;
                    ty = (Math.random() - 0.5) * 0.5;
                    tz = Math.sin(angle) * r;
                }
            }
            else if (mode === 'FLOWER') {
                const t = Math.random() * Math.PI * 2;
                const r = 5 * Math.cos(5 * t) + 7;
                tx = Math.cos(t) * r;
                ty = Math.sin(t) * r;
                tz = (Math.random() - 0.5) * 2;
            }
            else if (mode === 'EXPLODE') {
                tx = (Math.random() - 0.5) * 100;
                ty = (Math.random() - 0.5) * 100;
                tz = (Math.random() - 0.5) * 100;
            }
            else { // CLOUD
                tx = (Math.random() - 0.5) * 20;
                ty = (Math.random() - 0.5) * 20;
                tz = (Math.random() - 0.5) * 20;
            }

            targets[i3] = tx;
            targets[i3+1] = ty;
            targets[i3+2] = tz;
        }
    }

    // Input Listeners
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth - 0.5) * 30;
        mouse.y = -(e.clientY / window.innerHeight - 0.5) * 20;
    });

    window.addEventListener('mousedown', () => {
        points.material.color.setHSL(Math.random(), 0.8, 0.5);
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === '1') setShape('CLOUD');
        if (e.key === '2') setShape('HEART');
        if (e.key === '3') setShape('SATURN');
        if (e.key === '4') setShape('FLOWER');
        if (e.key === '5') setShape('EXPLODE');
    });

    function animate() {
        requestAnimationFrame(animate);
        
        const posArr = points.geometry.attributes.position.array;
        for (let i = 0; i < P_COUNT * 3; i++) {
            // Smoothly move toward target shape
            posArr[i] += (targets[i] - posArr[i]) * 0.05;
        }
        
        // System follows mouse
        points.position.x += (mouse.x - points.position.x) * 0.05;
        points.position.y += (mouse.y - points.position.y) * 0.05;
        
        points.rotation.y += 0.005;
        points.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }

    init();
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
